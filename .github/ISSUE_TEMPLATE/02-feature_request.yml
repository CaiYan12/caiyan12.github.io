name: 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议，请描述清楚动机与预期效果。
  - type: textarea
    id: related-problem
    attributes:
      label: 背景与动机
      description: 这个建议与什么问题或场景相关？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望实现的效果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式？
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 截图、参考站点或其他上下文。
