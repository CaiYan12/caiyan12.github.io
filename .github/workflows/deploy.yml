name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许该 job 克隆仓库并创建 Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        env:
          # 供构建期 fetch-github-repos 脚本拉取新增仓库元数据（Actions 自动提供）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 默认 node-version 24（与本机构建环境 v24.18.0 一致）；
        # package-manager 由 pnpm-lock.yaml 自动检测；build-cmd 默认执行 pnpm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
