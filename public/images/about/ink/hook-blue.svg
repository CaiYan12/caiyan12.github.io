<!-- ↳ 竖钩（蓝笔批注）。与 hook-ink.svg 分家：蓝笔随手，钩底更平（笔在纸面拖过去），
     两片箭羽张角大、长短不一，且起点不共尖。
     viewBox 70×100 对应 CSS 渲染 19.2×27.6px（0.8em/1.15em × font-size 24px），
     stroke-width 6.6 ≈ 1.8px。 -->
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 70 100' fill='none' stroke='#346292' stroke-opacity='.6' stroke-width='6.6' stroke-linecap='round' stroke-linejoin='round'>
